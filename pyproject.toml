[project]
name = "liudb"
version = "0.1.0"
description = "基于 DuckDB 的轻量量化数据存储包"
readme = "README.md"
authors = [
    { name = "20070316lbw-netizen", email = "lbw20070316lbw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "loguru>=0.7.3",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.4",
    "sources",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # 上界锁死: ruff 的默认规则集会随版本变化, 不设上界的话某次 minor
    # 升级就能让 CI 莫名其妙全红(与 sources 保持一致)。
    "pytest>=8.0.0",
    "ruff>=0.16.6,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 显式写死规则集, 不吃 ruff 的默认值(同上: 默认值会变)。
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # import 排序
    "UP",   # pyupgrade: 逼着用 3.12 原生写法
    "B",    # flake8-bugbear
    "C4",   # 推导式写法
    "SIM",  # 可简化的写法
    "RUF",  # ruff 自有规则
    "BLE",  # 禁止裸 except Exception
    "S",    # bandit 安全检查
]

ignore = [
    # 注释和文档字符串通篇是中文, 全角标点是本项目刻意的排版, 不是"易混淆字符"
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里 assert 是正常写法, 不是 bandit 说的那种线上裸断言
"tests/*" = ["S101"]
# reader 里的 SQL 只把代码里写死的表名/列名(白名单)拼进字符串, 所有外部传入的
# 值都走 DuckDB 的 `?` 占位符, 不存在注入; bandit 的 S608 在这里是误报。
"src/liudb/reader/*" = ["S608"]

[tool.uv.sources]
sources = { git = "https://github.com/20070316lbw-netizen/sources.git", rev = "v0.2.0" }

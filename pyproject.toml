[project]
name = "liudb"
version = "0.1.0"
description = "基于 DuckDB 的轻量量化数据存储包，适配 sources 数据源"
readme = "README.md"
authors = [
    { name = "20070316lbw-netizen", email = "lbw20070316lbw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "loguru>=0.7.3",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
